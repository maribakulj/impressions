[project]
name = "punctured-sky"
version = "0.1.0"
description = "Nested frames and what they do to a machine's reading of an image"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "pillow>=10.4",
  "matplotlib>=3.8",
  "torch==2.14.0",
  "torchvision",
  "transformers==5.17.0",
  "open-clip-torch==3.3.0",
  "sentencepiece>=0.2",
  "protobuf",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/punctured_sky"]
